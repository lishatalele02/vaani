org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.daemon=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Run the Kotlin compiler inside Gradle. Avoids "Could not connect to Kotlin compile daemon" errors.
kotlin.compiler.execution.strategy=in-process

# Default backend address baked into the app (you can also change it inside the app: Settings -> Server).
#   Emulator:        http://10.0.2.2:8000/
#   Physical phone:  http://YOUR_LAPTOP_WIFI_IP:8000/   (run `ipconfig`, use the IPv4 address)
samajh.serverUrl=http://10.0.2.2:8000/
